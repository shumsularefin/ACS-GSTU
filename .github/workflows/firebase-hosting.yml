name: Website checks and Firebase deployment

# Pushes to main: run every check, then build from the published Firestore content and deploy Hosting.
# Every 15 minutes: rebuild and redeploy only when editors published something new, so search
# engines and link previews pick it up, or when the Facebook Page has new posts for News.
# Visitors already see published changes immediately.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build from the seed content and run unit and site checks
        run: npm test
      - name: Security rules (Firestore emulator)
        run: npm run test:rules
      - run: npx playwright install --with-deps chromium
      - name: End-to-end dashboard and website tests (emulators)
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  freshness:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: compare
        env:
          # News from the Facebook Page (optional; see FACEBOOK.md).
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_GRAPH_VERSION: ${{ secrets.FACEBOOK_GRAPH_VERSION }}
        run: node scripts/needs-rebuild.mjs

  deploy:
    needs: [check, freshness]
    # After a successful check on main, or on schedule when published content changed.
    if: >-
      !cancelled() && !failure() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'schedule' && needs.freshness.outputs.changed == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build from the published content
        env:
          CONTENT_SOURCE: firestore
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_GRAPH_VERSION: ${{ secrets.FACEBOOK_GRAPH_VERSION }}
        run: node scripts/build.mjs
      - name: Check the built website
        run: node --test tests/unit/site.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: acs-gstu
          workload_identity_provider: projects/492197583844/locations/global/workloadIdentityPools/github-deploy/providers/github-repository
          service_account: github-hosting@acs-gstu.iam.gserviceaccount.com
      - name: Deploy Hosting (rules are deployed separately)
        env:
          FIREBASE_HOSTING_UPLOAD_CONCURRENCY: 5
        run: npx firebase deploy --only hosting --project acs-gstu --non-interactive
      - name: Keep only the newest releases
        run: node scripts/hosting-retention.mjs

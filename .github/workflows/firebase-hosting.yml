name: Website checks and Firebase deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run build
      - run: npm test

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run build
      - name: Install deployment CLI
        run: npm install --global firebase-tools@15.28.1
      - uses: google-github-actions/auth@v3
        with:
          project_id: acs-gstu
          workload_identity_provider: projects/492197583844/locations/global/workloadIdentityPools/github-deploy/providers/github-repository
          service_account: github-hosting@acs-gstu.iam.gserviceaccount.com
      - name: Deploy tested website
        env:
          FIREBASE_HOSTING_UPLOAD_CONCURRENCY: 5
        run: firebase deploy --only hosting --project acs-gstu --non-interactive
